<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Groove Player — Música para compartir</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 24px 32px 16px 32px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 16px;
        }

        .search-filter-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .search-input, .playlist-select {
            background-color: #242424;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px 16px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input {
            flex: 1;
        }

        .search-input:focus, .playlist-select:focus {
            border-color: #1db954;
        }

        .playlist-select {
            width: 200px;
            cursor: pointer;
        }

        main {
            padding: 0 32px 120px 32px;
            flex: 1;
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #181818;
            padding: 12px 16px;
            border-radius: 8px;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .track-card:hover {
            background-color: #282828;
        }

        .track-info-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .play-btn-small {
            background-color: #1db954;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #000;
            font-weight: bold;
            flex-shrink: 0;
        }

        .track-details h3 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .track-details p {
            font-size: 0.85rem;
            color: #b3b3b3;
        }

        .track-badge {
            background-color: #2a2a2a;
            color: #b3b3b3;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        /* --- BARRA INFERIOR DEL REPRODUCTOR --- */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 16px 24px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            gap: 16px;
            z-index: 1000;
        }

        .player-current-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-current-thumb {
            width: 48px;
            height: 48px;
            background-color: #282828;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .player-current-text h4 {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .player-current-text p {
            font-size: 0.8rem;
            color: #b3b3b3;
        }

        .player-center-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: #ffffff;
        }

        .main-play-btn {
            background-color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #000;
            font-weight: bold;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 500px;
            font-size: 0.75rem;
            color: #b3b3b3;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            accent-color: #ffffff;
        }

        .player-volume-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .volume-bar {
            width: 100px;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            outline: none;
            accent-color: #ffffff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Explora la música</h1>
        <div class="search-filter-bar">
            <input type="text" class="search-input" placeholder="Buscar canción o artista...">
            <select class="playlist-select">
                <option value="all">Todas las playlists</option>
                <option value="General">General</option>
            </select>
        </div>
    </header>

    <main>
        <div class="track-list" id="trackList">
            <!-- Tus canciones se cargan aquí -->
        </div>
    </main>

    <!-- Barra Reproductor Fijo -->
    <div class="player-bar">
        <div class="player-current-info">
            <div class="player-current-thumb">🎵</div>
            <div class="player-current-text">
                <h4 id="currentTitle">Selecciona una canción</h4>
                <p id="currentArtist">Artista desconocido</p>
            </div>
        </div>

        <div class="player-center-controls">
            <div class="control-buttons">
                <button class="control-btn" id="prevBtn">⏮</button>
                <button class="main-play-btn" id="playPauseBtn">▶</button>
                <button class="control-btn" id="nextBtn">⏭</button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100">
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <div class="player-volume-container">
            <span>🔊</span>
            <input type="range" class="volume-bar" id="volumeBar" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qdnmogvlcjareklosiuu.supabase.co/storage/v1/object/public/music/";
        let audioElement = new Audio();

        // Función original con el ajuste de encodeURI para corregir las rutas con espacios
        function playTrack(storagePath, title, artist) {
            audioElement.src = SUPABASE_URL + encodeURI(storagePath);
            audioElement.play().then(() => {
                document.getElementById('playPauseBtn').textContent = '⏸';
                document.getElementById('currentTitle').textContent = title;
                document.getElementById('currentArtist').textContent = artist || 'Artista desconocido';
            }).catch(error => {
                console.error("Bloqueo de reproducción automática:", error);
            });
        }

        const playPauseBtn = document.getElementById('playPauseBtn');
        playPauseBtn.addEventListener('click', () => {
            if (audioElement.paused) {
                audioElement.play();
                playPauseBtn.textContent = '⏸';
            } else {
                audioElement.pause();
                playPauseBtn.textContent = '▶';
            }
        });

        audioElement.addEventListener('timeupdate', () => {
            const progressBar = document.getElementById('progressBar');
            if (audioElement.duration) {
                progressBar.value = (audioElement.currentTime / audioElement.duration) * 100;
                document.getElementById('currentTime').textContent = formatTime(audioElement.currentTime);
                document.getElementById('durationTime').textContent = formatTime(audioElement.duration);
            }
        });

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
        }
    </script>
</body>
</html>
